# docker-compose.yaml
services:
  # ======================================================================
  # DATA SYNC SERVICE
  # This is used to create a Docker volume with source training data
  # to avoid constantly reading data slowly from the WSL2 host.
  # ======================================================================
  data-sync:
    image: alpine:latest
    volumes:
##########################################################################
      # Mount host directory (Read-Write so we can burn the flag)
      # FALLBACK: If Conductor doesn't set VARIA_DATASET_DIR, use your manual path.
      # (Using forward slashes here prevents YAML parsing errors with backslashes)
      # 
      # ARCHITECTURE NOTE: This volume exists because Docker Desktop on
      # Windows (WSL2 backend) has extremely poor bind-mount read performance. 
      # The data-sync service copies the source data into a Docker-native volume ONCE, 
      # then the trainer reads from the fast volume for potentially hundreds of epochs.
      #
      # Do NOT remove this volume and bind-mount the source directly into
      # the trainer — that re-introduces the WSL2 bind-mount bottleneck on
      # every epoch.
      #
      # Standalone usage: if VARIA_DATASET_DIR is not set (no Conductor),
      # the fallback path below is used. Step 6 writes .new_data_flag into
      # output_sliced/, so standalone docker compose runs still sync correctly.
      - "${VARIA_DATASET_DIR:-D:/!staging/@Mestrado/PCBA-AOI/output_sliced}:/src"
##########################################################################     
      # Mount the Docker volume for the destination
      - varia_sliced_dataset:/dest
    command: >
      sh -c "
      if [ -f /src/.dataset_id ] && [ -f /dest/.dataset_id ] && cmp -s /src/.dataset_id /dest/.dataset_id; then
        echo '[data-sync] Fingerprint matches — volume is current, skipping.';
        exit 0;
      fi;
      echo '[data-sync] Fingerprint differs or missing — delta-syncing with rsync...';
      if ! command -v rsync >/dev/null 2>&1; then
        apk add --no-cache rsync >/dev/null 2>&1;
      fi;
      rsync -a --delete /src/ /dest/;
      echo '[data-sync] Sync complete.';
      "
  # ======================================================================
  # RF-DETR TRAINING / EVALUATION SERVICE
  # ======================================================================
  rfdetr:
    depends_on:
      data-sync:
        condition: service_completed_successfully
    build: .
    # container_name removed deliberately: two parallel Conductor instances
    # may share this compose project. Docker Compose auto-generates unique names
    # from ${COMPOSE_PROJECT_NAME}_{service}_{replica}, which Conductor sets
    # per instance. A hardcoded name makes parallel runs impossible.
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # The training container just mounts the populated volume
      - varia_sliced_dataset:/workspace/data:ro
      
      # FALLBACKS: Map to local relative paths for manual execution
      - "${VARIA_OUTPUT_DIR:-./output}:/workspace/output"
      - "${VARIA_METRICS_DIR:-./metrics}:/workspace/metrics"
      - "${VARIA_CACHE_DIR:-./roboflow_cache}:/root/.roboflow" 
      - "${VARIA_CONFIG_FILE:-./config.yaml}:/workspace/code/config.yaml:ro"
      - "${VARIA_TRAIN_SCRIPT:-./rfdetr_train.py}:/workspace/code/rfdetr_train.py:ro"
      - "${VARIA_EVAL_SCRIPT:-./rfdetr_eval.py}:/workspace/code/rfdetr_eval.py:ro"
      
    working_dir: /workspace/code
    
    # FALLBACK: Defaults to training. Conductor overrides this for evaluation.
    command: ${VARIA_COMMAND:-python rfdetr_train.py}
    
    stdin_open: true 
    tty: true       
    
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0,1} # default to dual GPU when running standalone
      - NCCL_DEBUG=INFO
      - NCCL_P2P_DISABLE=1
      - NCCL_IB_DISABLE=1
      - NCCL_SOCKET_IFNAME=eth0
      - OMP_NUM_THREADS=1
      - PYTHONFAULTHANDLER=1
    shm_size: '16gb' 

volumes:
  varia_sliced_dataset:
    # Conductor overrides this per-instance. Standalone runs without
    # VARIA_DOCKER_VOLUME_NAME resolve to the original name.
    name: ${VARIA_DOCKER_VOLUME_NAME:-varia_sliced_dataset}